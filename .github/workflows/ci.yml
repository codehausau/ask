name: ci

# Quality gate for both workspace packages: strict types, unit tests on every
# supported Node, native TUI tests under Bun, and a check that the packed
# tarballs actually install and run together.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # The completion script ships with the tool, so lint it too. shellcheck
      # is preinstalled on ubuntu-latest runners.
      - name: shellcheck
        run: shellcheck -x -s bash packages/ask/completions/ask.bash packages/ask/test/completion-harness.sh

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # No API key anywhere in CI: --dry-run and --show-context never call out.
      - run: node dist/src/cli.js --dry-run '@src/context.ts review this' > /dev/null
        working-directory: packages/ask
      - run: node dist/src/cli.js --show-context '@src @test'
        working-directory: packages/ask

  tui:
    name: OpenTUI (Bun ${{ matrix.bun-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        bun-version: [1.3.14, 1.4.4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ matrix.bun-version }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:bun
      - run: node packages/ask-tui/dist/src/launcher.js --help

  package:
    name: packaged install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Pack
        id: pack
        run: |
          set -euo pipefail
          directory=$(mktemp -d "$RUNNER_TEMP/ask-package.XXXXXX")
          # pnpm (not npm) rewrites ask-tui's workspace:* dependency to the exact version.
          for package in ask ask-tui; do
            pnpm --dir "packages/$package" pack --pack-destination "$directory"
          done
          version=$(node -p "require('./packages/ask/package.json').version")
          for name in ask ask-tui; do
            test -f "$directory/codehaus-au-$name-$version.tgz"
          done
          {
            echo "core=$directory/codehaus-au-ask-$version.tgz"
            echo "tui=$directory/codehaus-au-ask-tui-$version.tgz"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
      - name: Install the core tarball globally and run it
        working-directory: ${{ runner.temp }}
        env:
          TARBALL: ${{ steps.pack.outputs.core }}
          EXPECTED_VERSION: ${{ steps.pack.outputs.version }}
        # Installing our own freshly packed tarball is the point of this job,
        # so the lack of a lockfile here is intentional.
        # zizmor: ignore[adhoc-packages]
        run: |
          set -euo pipefail
          npm install --global --ignore-scripts "$TARBALL"
          test "$(ask --version)" = "ask $EXPECTED_VERSION"
          ask --help > /dev/null
          ask --install-completion > /dev/null
          echo 'const x = 1;' > sample.ts
          ask --no-session --show-context '@sample.ts' </dev/null
      # ask-tui pins the exact core version, which is not on npm before release.
      # Installing both tarballs into one project satisfies the pin locally.
      - name: Install both tarballs together
        id: tui
        env:
          CORE: ${{ steps.pack.outputs.core }}
          TUI: ${{ steps.pack.outputs.tui }}
        # zizmor: ignore[adhoc-packages]
        run: |
          set -euo pipefail
          project=$(mktemp -d "$RUNNER_TEMP/ask-tui-install.XXXXXX")
          cd "$project"
          echo '{"private":true}' > package.json
          npm install --no-save --ignore-scripts --no-audit --no-fund "$CORE" "$TUI"
          echo "launcher=$project/node_modules/.bin/ask-tui" >> "$GITHUB_OUTPUT"
      - name: Exercise installed native TUI in a pseudo-terminal
        env:
          LAUNCHER: ${{ steps.tui.outputs.launcher }}
        run: python3 packages/ask-tui/test/package-smoke.py "$LAUNCHER"
      - name: Verify npm publish metadata without uploading
        env:
          CORE: ${{ steps.pack.outputs.core }}
          TUI: ${{ steps.pack.outputs.tui }}
        run: |
          set -euo pipefail
          for tarball in "$CORE" "$TUI"; do
            npm publish "$tarball" --dry-run --ignore-scripts --provenance=false --access public --registry https://registry.npmjs.org
          done
