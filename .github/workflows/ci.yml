name: ci

# Quality gate: strict types, unit tests on every supported Node, and a check
# that the packaged tarball actually installs and runs.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # The completion script ships with the tool, so lint it too. shellcheck
      # is preinstalled on ubuntu-latest runners.
      - name: shellcheck
        run: shellcheck -x -s bash completions/ask.bash test/completion-harness.sh

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # No API key anywhere in CI: --dry-run and --show-context never call out.
      - run: node dist/src/cli.js --dry-run '@src/context.ts review this' > /dev/null
      - run: node dist/src/cli.js --show-context '@src @test'

  package:
    name: packaged install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Pack
        id: pack
        run: |
          set -euo pipefail
          directory=$(mktemp -d "$RUNNER_TEMP/ask-package.XXXXXX")
          pnpm pack --pack-destination "$directory"
          tarballs=("$directory"/*.tgz)
          if [ "${#tarballs[@]}" -ne 1 ] || [ ! -f "${tarballs[0]}" ]; then
            echo 'Expected exactly one packed tarball' >&2
            exit 1
          fi
          {
            echo "tarball=${tarballs[0]}"
            echo "version=$(node -p "require('./package.json').version")"
          } >> "$GITHUB_OUTPUT"
      - name: Install the tarball globally and run it
        working-directory: ${{ runner.temp }}
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
          EXPECTED_VERSION: ${{ steps.pack.outputs.version }}
        # Installing our own freshly packed tarball is the point of this job,
        # so the lack of a lockfile here is intentional.
        # zizmor: ignore[adhoc-packages]
        run: |
          set -euo pipefail
          npm install --global --ignore-scripts "$TARBALL"
          test "$(ask --version)" = "ask $EXPECTED_VERSION"
          ask --help > /dev/null
          ask --install-completion > /dev/null
          echo 'const x = 1;' > sample.ts
          ask --no-session --show-context '@sample.ts' </dev/null
      - name: Verify npm publish metadata without uploading
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: npm publish "$TARBALL" --dry-run --ignore-scripts --provenance=false --access public --registry https://registry.npmjs.org
