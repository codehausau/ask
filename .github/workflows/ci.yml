name: ci

# Quality gate: strict types, unit tests on every supported Node, and a check
# that the packaged tarball actually installs and runs.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # The completion script ships with the tool, so lint it too. shellcheck
      # is preinstalled on ubuntu-latest runners.
      - name: shellcheck
        run: shellcheck -x -s bash completions/ask.bash test/completion-harness.sh

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # No API key anywhere in CI: --dry-run and --show-context never call out.
      - run: node dist/src/cli.js --dry-run '@src/context.ts review this' > /dev/null
      - run: node dist/src/cli.js --show-context '@src @test'

  package:
    name: packaged install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Pack
        run: pnpm pack --pack-destination "$RUNNER_TEMP"
      - name: Install the tarball globally and run it
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          tarball=$(ls ./*.tgz)
          npm install --global "$tarball"
          ask --version
          ask --help > /dev/null
          echo 'const x = 1;' > sample.ts
          ask --show-context '@sample.ts'
