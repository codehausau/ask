name: release

# CD: Release Please dispatches this workflow at its new version tag. Verify one
# tarball, publish it to npm with provenance, then attach it and its SBOM to the
# existing GitHub Release. Direct tag pushes and manual validation also work.
# Requires the repository Actions secret NPM_TOKEN (granular publish token).
#
# Install from a release:
#   npm install --global @codehaus-au/ask

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # create the release
      id-token: write # npm provenance and GitHub build-provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          # No dependency cache in the publishing workflow: a poisoned cache
          # entry could otherwise end up inside a released artifact.
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      # Never ship something that does not typecheck or pass its tests.
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm audit --audit-level high --prod

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $pkg" >&2
            exit 1
          fi

      # prepack builds too, but stating it here keeps the order obvious.
      - run: pnpm build

      - name: Pack
        id: pack
        run: |
          set -euo pipefail
          directory=$(mktemp -d "$RUNNER_TEMP/ask-release.XXXXXX")
          pnpm pack --pack-destination "$directory"
          tarballs=("$directory"/*.tgz)
          if [ "${#tarballs[@]}" -ne 1 ] || [ ! -f "${tarballs[0]}" ]; then
            echo 'Expected exactly one packed tarball' >&2
            exit 1
          fi
          {
            echo "tarball=${tarballs[0]}"
            echo "directory=$directory"
            echo "version=$(node -p "require('./package.json').version")"
            echo "dist-tag=$(node -p "/^[0-9]+\\.[0-9]+\\.[0-9]+-/.test(require('./package.json').version) ? 'next' : 'latest'")"
          } >> "$GITHUB_OUTPUT"

      # Installing our own freshly built tarball is the point of this step, so
      # the lack of a lockfile here is intentional.
      #
      # It must run from a directory containing no package.json: `npm install
      # --global <tarball>` from inside the package's own root hangs
      # indefinitely, which is what failed the first tagged release while the
      # identical check in ci.yml passed — that one already ran in RUNNER_TEMP.
      - name: Verify the tarball installs and runs
        working-directory: ${{ runner.temp }}
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
          EXPECTED_VERSION: ${{ steps.pack.outputs.version }}
        # zizmor: ignore[adhoc-packages]
        run: |
          set -euo pipefail
          npm install --global --ignore-scripts "$TARBALL"
          test "$(ask --version)" = "ask $EXPECTED_VERSION"
          ask --help > /dev/null
          ask --install-completion > /dev/null
          printf 'export const sample = 1;\n' > "$RUNNER_TEMP/ask-release-sample.ts"
          ask --no-session --show-context --file "$RUNNER_TEMP/ask-release-sample.ts" </dev/null

      - name: Check npm publication without uploading
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
          DIST_TAG: ${{ steps.pack.outputs.dist-tag }}
        run: npm publish "$TARBALL" --dry-run --ignore-scripts --provenance=false --access public --tag "$DIST_TAG" --registry https://registry.npmjs.org

      - name: SBOM for the release artifact
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: cyclonedx-json
          artifact-name: sbom.cyclonedx.json
          output-file: ${{ steps.pack.outputs.directory }}/sbom.cyclonedx.json
          # Upload both release assets together only after npm publication.
          upload-release-assets: false

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.pack.outputs.tarball }}

      - name: Publish the verified tarball to npm
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
          DIST_TAG: ${{ steps.pack.outputs.dist-tag }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo 'Add the NPM_TOKEN repository Actions secret before publishing.' >&2
            exit 1
          fi
          # Publish the already tested bytes; no lifecycle scripts run with the token.
          npm publish "$TARBALL" --ignore-scripts --provenance --access public --tag "$DIST_TAG" --registry https://registry.npmjs.org

      # `gh` ships with the runner, so the release path pulls in no third-party
      # action beyond the ones already needed to build.
      - name: Attach artifacts to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
          SBOM: ${{ steps.pack.outputs.directory }}/sbom.cyclonedx.json
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null; then
            # Preserve the changelog and metadata created by Release Please.
            gh release upload "$GITHUB_REF_NAME" "$TARBALL" "$SBOM" --repo "$GITHUB_REPOSITORY"
          else
            # Directly pushed tags may not have a GitHub Release yet.
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              "$TARBALL" \
              "$SBOM"
          fi
