name: release

# CD: tag `vX.Y.Z` -> verify, pack, sign provenance, publish a GitHub Release
# with the tarball and its SBOM attached.
#
#   pnpm version patch && git push --follow-tags
#
# Install from a release:
#   npm install --global https://github.com/codehausau/ask/releases/download/vX.Y.Z/codehaus-ask-X.Y.Z.tgz

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # create the release
      id-token: write # sign the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          # No dependency cache in the publishing workflow: a poisoned cache
          # entry could otherwise end up inside a released artifact.
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      # Never ship something that does not typecheck or pass its tests.
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm audit --audit-level high --prod

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $pkg" >&2
            exit 1
          fi

      - name: Pack
        id: pack
        run: |
          set -euo pipefail
          pnpm pack --pack-destination dist-release
          echo "tarball=$(ls dist-release/*.tgz)" >> "$GITHUB_OUTPUT"

      - name: Verify the tarball installs and runs
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        # Installing our own freshly built tarball is the point of this step, so
        # the lack of a lockfile here is intentional.
        # zizmor: ignore[adhoc-packages]
        run: |
          set -euo pipefail
          npm install --global "$TARBALL"
          ask --version
          ask --help > /dev/null

      - name: SBOM for the release artifact
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: cyclonedx-json
          artifact-name: sbom.cyclonedx.json
          output-file: dist-release/sbom.cyclonedx.json

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.pack.outputs.tarball }}

      # `gh` ships with the runner, so the release path pulls in no third-party
      # action beyond the ones already needed to build.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist-release/*.tgz \
            dist-release/sbom.cyclonedx.json
